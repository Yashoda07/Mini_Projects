<!DOCTYPE html>
<html>
    <head>
        <title> Calculator </title>
        <link rel = "stylesheet" href = "style.css">
    </head>

    <body>
        <div class = "container">

            <input type = "Text" placeholder = "enter the number" class = "input">

            <div class = "gallery-row"></div>
            <button> 1 </button>
            <button> 2 </button>
            <button> 3 </button>
            <button> + </button>
            <div class = "gallery-row"></div>
            <button> 4 </button>
            <button> 5 </button>
            <button> 6 </button>
            <button> - </button>
            <div class = "gallery-row"></div>
            <button> 7 </button>
            <button> 8 </button>
            <button> 9 </button>
            <button> * </button>
            <div class = "gallery-row"></div>
            <button> Back </button>
            <button> / </button>
            <button> = </button>
        </div>

    </body>
</html>
